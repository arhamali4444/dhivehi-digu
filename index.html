/* ---------- online play: encrypted relay ----------
   Phones talk through public MQTT relays over secure WebSockets, so players on mobile data
   or different Wi-Fi networks can join. A tiny built-in MQTT client is used (no library
   download). Each player's cards are end-to-end encrypted (ECDH + AES-GCM). */
const NS='dhivehidigu/v2/';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let isHost=false,net=null,joinInfo=null,pool=null,poolT=null,srvState='checking';const lobbyList={};
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');};
async function newKeys(){const kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return{kp:kp,pub:b64(new Uint8Array(await crypto.subtle.exportKey('raw',kp.publicKey)))};}
async function sharedKey(priv,pubB64){const pk=await crypto.subtle.importKey('raw',unb64(pubB64),{name:'ECDH',namedCurve:'P-256'},false,[]);return crypto.subtle.deriveKey({name:'ECDH',public:pk},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,TE.encode(JSON.stringify(obj)));return{i:b64(iv),c:b64(new Uint8Array(ct))};}
async function unseal(key,m){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.i)},key,unb64(m.c));return JSON.parse(TD.decode(pt));}

/* tiny MQTT 3.1.1 client (QoS 0) */
function MQ(url,opts){
const self={connected:false,reconnecting:true};
let ws=null,buf=new Uint8Array(0),pingT=null,retryT=null,ctT=null,ended=false,pid=0,delay=1500,lastIn=0;
const subs=new Set(),clientId='dd_'+rid(7);
const str=s=>{const b=TE.encode(s),o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o;};
function packet(head,parts){const bodyLen=parts.reduce((t,p)=>t+p.length,0);let len=bodyLen;const lb=[];do{let d=len%128;len=Math.floor(len/128);if(len>0)d|=128;lb.push(d);}while(len>0);
const out=new Uint8Array(1+lb.length+bodyLen);out[0]=head;out.set(lb,1);let off=1+lb.length;parts.forEach(p=>{out.set(p,off);off+=p.length;});return out;}
function send(u8){if(ws&&ws.readyState===1){try{ws.send(u8);return true;}catch(e){}}return false;}
function nextId(){pid=pid%65535+1;return new Uint8Array([pid>>8,pid&255]);}
function schedule(){if(ended)return;clearTimeout(retryT);self.reconnecting=true;retryT=setTimeout(connect,delay);delay=Math.min(15000,delay*1.6);}
function drop(w){if(ws!==w)return;clearTimeout(ctT);clearInterval(pingT);ws=null;buf=new Uint8Array(0);const was=self.connected;self.connected=false;if(was&&opts.onDown)opts.onDown();schedule();}
function connect(){if(ended)return;let w;try{w=new WebSocket(url,['mqtt']);}catch(e){schedule();return;}
ws=w;w.binaryType='arraybuffer';
ctT=setTimeout(()=>{if(ws===w&&!self.connected){try{w.close();}catch(e){}drop(w);}},9000);
w.onopen=()=>{if(ws!==w)return;send(packet(0x10,[new Uint8Array([0,4,77,81,84,84,4,2,0,30]),str(clientId)]));};
w.onmessage=e=>{if(ws!==w)return;lastIn=Date.now();const d=new Uint8Array(e.data);const nb=new Uint8Array(buf.length+d.length);nb.set(buf);nb.set(d,buf.length);buf=nb;parse();};
w.onclose=()=>drop(w);w.onerror=()=>{try{w.close();}catch(e){}drop(w);};}
function parse(){while(buf.length>=2){let mul=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mul;mul*=128;}while(b&128);
if(buf.length<i+len)return;const head=buf[0],body=buf.slice(i,i+len);buf=buf.slice(i+len);handle(head>>4,head&15,body);}}
function handle(type,flags,b){
if(type===2){if(b[1]!==0){try{ws&&ws.close();}catch(e){}return;}
self.connected=true;self.reconnecting=false;delay=1500;clearTimeout(ctT);lastIn=Date.now();
if(subs.size)sub([...subs]);clearInterval(pingT);
pingT=setInterval(()=>{if(Date.now()-lastIn>50000){const w=ws;try{w&&w.close();}catch(e){}drop(w);return;}send(new Uint8Array([0xC0,0]));},20000);
opts.onUp&&opts.onUp();}
else if(type===3){const qos=(flags>>1)&3,tl=(b[0]<<8)|b[1];const topic=TD.decode(b.subarray(2,2+tl));let off=2+tl;
if(qos>0){const hi=b[off],lo=b[off+1];off+=2;send(new Uint8Array([qos===1?0x40:0x50,2,hi,lo]));}
opts.onMsg&&opts.onMsg(topic,b.subarray(off));}}
function sub(topics){topics.forEach(t=>subs.add(t));if(!self.connected)return;const parts=[nextId()];topics.forEach(t=>{parts.push(str(t));parts.push(new Uint8Array([0]));});send(packet(0x82,parts));}
function unsub(topics){topics.forEach(t=>subs.delete(t));if(!self.connected)return;send(packet(0xA2,[nextId()].concat(topics.map(str))));}
function publish(topic,payload,retain){if(!self.connected)return false;const p=typeof payload==='string'?TE.encode(payload):payload;return send(packet(0x30|(retain?1:0),[str(topic),p]));}
function end(){ended=true;clearTimeout(retryT);clearTimeout(ctT);clearInterval(pingT);const w=ws;ws=null;if(w){try{if(self.connected)w.send(new Uint8Array([0xE0,0]));w.close();}catch(e){}}self.connected=false;}
function reconnect(){if(ended||self.connected)return;clearTimeout(retryT);delay=1500;const w=ws;ws=null;if(w){try{w.close();}catch(e){}}connect();}
Object.assign(self,{subscribe:sub,unsubscribe:unsub,publish:publish,end:end,reconnect:reconnect});connect();return self;}

function makeClients(){return BROKERS.map((url,bi)=>{const o={bi:bi,ok:false,up:null,h:null,subs:()=>[],onUp2:null,c:null};
o.c=MQ(url,{onUp:()=>{o.ok=true;const t=o.subs();if(t.length)o.c.subscribe(t);if(o.up){const f=o.up;o.up=null;f();}o.onUp2&&o.onUp2();},
onDown:()=>{o.ok=false;},onMsg:(topic,p)=>{if(!o.h)return;let m=null;if(p.length){try{m=JSON.parse(TD.decode(p));}catch(e){return;}}o.h(o,topic,m);}});return o;});}
function takeClients(subs,h){clearTimeout(poolT);const cl=pool||makeClients();pool=null;cl.forEach(o=>{o.c.unsubscribe([NS+'lobby/+']);o.subs=subs;o.h=h;o.onUp2=null;if(o.ok){const t=subs();if(t.length)o.c.subscribe(t);}});return cl;}
function anyUp(cl,ms){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(t);res(v);};const t=setTimeout(()=>fin(cl.some(o=>o.ok)),ms);cl.forEach(o=>{if(o.ok)fin(true);else o.up=()=>fin(true);});});}
const pub=(o,topic,obj,retain)=>!!(o&&o.c&&o.ok&&o.c.publish(topic,typeof obj==='string'?obj:JSON.stringify(obj),retain));
function srvHTML(){const t={checking:'Connecting to the game server…',ok:'Game server connected',fail:'Can’t reach the game server on this network'}[srvState];return `<p class="srv s-${srvState}" id="srv"><i></i>${t}</p>`;}
function updSrv(){const e=document.getElementById('srv');if(e)e.outerHTML=srvHTML();}
function setSrv(v){if(srvState!==v){srvState=v;updSrv();}}
function warmUp(){if(net||db||!window.WebSocket)return;
if(!pool){pool=makeClients();const p0=pool;p0.forEach(o=>o.onUp2=()=>{setSrv('ok');if(screen==='friends')updOpenList();});anyUp(p0,10000).then(v=>{if(!v&&pool===p0&&srvState!=='ok'){setSrv('fail');if(screen==='friends')updOpenList();}});}
const p=pool;p.forEach(o=>{o.h=onLobbyMsg;o.subs=()=>[NS+'lobby/+'];if(o.ok)o.c.subscribe([NS+'lobby/+']);});
clearTimeout(poolT);poolT=setTimeout(()=>{if(pool!==p)return;if(screen==='friends'||screen==='quick'){warmUp();return;}p.forEach(o=>o.c.end());pool=null;},5*60*1000);}
function onLobbyMsg(o,topic,m){const pre=NS+'lobby/';if(topic.indexOf(pre)!==0)return;const code=topic.slice(pre.length);if(!/^[A-Z]{4}$/.test(code))return;
if(!m||!m.t){delete lobbyList[code];}
else{const cur=lobbyList[code];if(!cur||+m.t>=cur.t)lobbyList[code]={code:code,name:cleanName(m.name),pc:String(m.pc||''),n:Math.max(1,Math.min(6,m.n|0)),t:+m.t,c:+m.c||+m.t,status:m.status==='lobby'?'lobby':'busy',q:!!m.q,host:String(m.host||'')};}
if(screen==='friends')updOpenList();quickCheck();}
function openTables(){const now=Date.now();return Object.values(lobbyList).filter(x=>x.status==='lobby'&&x.n<6&&Math.abs(now-x.t)<100000&&x.host!==myId).sort((a,b)=>b.n-a.n||b.t-a.t);}
function openListHTML(){if(db)return '<p class="empty-list">Open tables are available in the published game.</p>';const l=openTables();
if(!l.length)return `<p class="empty-list">${srvState==='fail'?'Can’t load open tables on this network.':srvState==='checking'?'Loading open tables…':'No open tables right now. Create a public table, or try Quick Match.'}</p>`;
return l.map(x=>`<div class="otable"><span class="mini">${pieceHTML(PIECES[x.pc]?x.pc:'manta',PC[0])}</span><div class="ot"><b>${esc(x.name)}’s table</b><small>${x.n} of 6 players${x.q?', quick match':''}</small></div><button class="btn soft sm" data-a="joinOpen" data-code="${esc(x.code)}">Join</button></div>`).join('');}
let listT=0;function updOpenList(){if(listT)return;listT=setTimeout(()=>{listT=0;const e=$('#openlist');if(e)e.innerHTML=openListHTML();},250);}
setInterval(()=>{if(screen==='friends'&&!document.hidden)updOpenList();},5000);
const netErrMsg='Can’t reach the game server. If you’re on office or school Wi-Fi, try mobile data.';
let wakeLock=null;
async function keepAwake(on){try{if(on){if(!wakeLock&&!document.hidden&&navigator.wakeLock){const w=await navigator.wakeLock.request('screen');wakeLock=w;w.addEventListener('release',()=>{if(wakeLock===w)wakeLock=null;});}}else if(wakeLock){const w=wakeLock;wakeLock=null;await w.release();}}catch(e){}}
function busy(btn,txt){const old=btn.textContent;btn.disabled=true;btn.textContent=txt;return()=>{btn.disabled=false;btn.textContent=old;};}
function netClose(){const n=net;net=null;if(!n)return;(n.timers||[]).forEach(t=>clearInterval(t));clearTimeout(n.failT);
if(n.role==='host'&&n.code)(n.clients||[]).forEach(o=>{try{o.c.publish(NS+n.code+'/i','',true);}catch(e){}});
if(n.role==='host'&&n.code&&n.listed)(n.clients||[]).forEach(o=>{try{o.c.publish(NS+'lobby/'+n.code,'',true);}catch(e){}});
(n.clients||[]).forEach(o=>{o.h=null;o.onUp2=null;});
setTimeout(()=>{(n.clients||[]).forEach(o=>{try{o.c.end();}catch(e){}});},n.role==='host'?700:300);}
function cleanupP2P(){netClose();isHost=false;joinInfo=null;}
function endP2P(){cleanupP2P();keepAwake(false);closeOv();closeSheet();S=null;mode=null;renderHome();}
function redact(st,pid){const d=clone(st);if(d.hands)for(const k in d.hands)if(k!==pid)d.hands[k]=d.hands[k].map(()=>'x');if(d.stock)d.stock=d.stock.map(()=>'x');
if(d.move&&d.move.t==='stock'&&d.players[d.move.p]&&d.players[d.move.p].id!==pid)d.move.c=null;return d;}
function netPrecheck(btn,txt){if(!(window.WebSocket&&window.crypto&&crypto.subtle&&window.TextEncoder)){toast('This browser can’t play online. Try Chrome or Safari.',5000);return null;}return busy(btn,txt);}

/* host */
async function sendPlayer(topic,pl,obj){const n=net;if(!n||n.role!=='host'||!pl||!pl.key)return;try{const m=await seal(pl.key,obj);let o=n.clients[pl.bi];if(!o||!o.ok)o=n.clients.find(x=>x.ok);pub(o,NS+n.code+'/p/'+topic,m);}catch(e){}}
function sendState(topic,pl){if(S&&pl.pid)sendPlayer(topic,pl,{k:'state',s:redact(S,pl.pid)});}
function broadcast(){const n=net;if(!n||n.role!=='host')return;n.players.forEach((pl,topic)=>{if(pl.pid)sendState(topic,pl);});updListing();}
function updListing(){const n=net;if(!n||n.role!=='host'||!n.code||!S)return;const topic=NS+'lobby/'+n.code;
const show=n.isPublic&&S.status==='lobby'&&S.players.length<6;
if(show){const h=S.players[0]||{};n.listed=true;const msg={v:2,code:n.code,name:h.name,pc:h.piece,n:S.players.length,t:Date.now(),c:n.created,status:'lobby',q:n.quick,host:myId};n.clients.forEach(o=>pub(o,topic,msg,true));}
else if(n.listed){n.listed=false;n.clients.forEach(o=>{if(o.ok)o.c.publish(topic,'',true);});}}
function setLobbyPub(v){const n=net;if(!n||n.role!=='host'||!S||S.status!=='lobby')return;n.isPublic=v;const N=clone(S);N.pub=v;N.rev++;N.by=myId;commit(N);}
function kickPlayer(id){const n=net;if(!n||n.role!=='host'||!S||S.status!=='lobby'||id===myId)return;n.banned.add(id);
n.players.forEach((pl,tp)=>{if(pl.pid===id){sendPlayer(tp,pl,{k:'err',m:'The host removed you from this table.'});n.players.delete(tp);}});
const idx=S.players.findIndex(q=>q.id===id);if(idx>=0){const N=clone(S);N.players.splice(idx,1);N.rev++;N.by=myId;commit(N);}}
function quickCheck(){const n=net;if(!n||n.role!=='host'||!n.quick||!S||S.status!=='lobby'||S.players.length>1||n.merging)return;
const other=openTables().filter(x=>x.q&&x.code!==n.code&&(x.c<n.created||(x.c===n.created&&x.code<n.code)))[0];if(!other)return;
n.merging=true;mode=null;S=null;isHost=false;cleanupP2P();renderQuickWait('Joining '+other.name+'’s table…');const run=quickRun;
setTimeout(()=>{if(run!==quickRun)return;const btn=$('#qbtn');if(btn)netJoin(btn,myName(),other.code,{timeout:10000,onFail:()=>{if(run===quickRun)tryQuick(run,new Set([other.code]));}});},200);}
async function netCreate(btn,name,opts){opts=opts||{};const failed=()=>{if(opts.onFail)opts.onFail();};const done0=netPrecheck(btn,'Connecting…');if(!done0){failed();return;}const done=()=>{done0();};let n=null;
try{cleanupP2P();const keys=await newKeys();
n={role:'host',code:null,kp:keys.kp,pub:keys.pub,players:new Map(),seen:{},timers:[],clients:[],isPublic:!!opts.pub,quick:!!opts.quick,created:Date.now(),banned:new Set(),listed:false};net=n;
n.clients=takeClients(()=>n.code?[NS+n.code+'/h'].concat(n.quick?[NS+'lobby/+']:[]):[],onHostMsg);
const up=await anyUp(n.clients,10000);if(net!==n){done();return;}
if(!up){setSrv('fail');toast(netErrMsg,5000);cleanupP2P();done();failed();return;}
setSrv('ok');btn.textContent='Creating table…';
let code=null;
for(let a=0;a<3&&!code;a++){const c=genCode();n.seen[c]=null;n.clients.forEach(o=>{if(o.ok)o.c.subscribe([NS+c+'/i']);});
await sleep(900);n.clients.forEach(o=>{if(o.ok)o.c.unsubscribe([NS+c+'/i']);});
const x=n.seen[c];if(!x||!x.t||Math.abs(Date.now()-x.t)>10*60*1000)code=c;}
if(net!==n){done();return;}
n.code=code||genCode();
n.clients.forEach(o=>{if(o.ok){const t=n.quick?[NS+n.code+'/h',NS+'lobby/+']:[NS+n.code+'/h'];o.c.subscribe(t);}});
const info=()=>{if(net!==n)return;n.clients.forEach(o=>pub(o,NS+n.code+'/i',{v:2,host:myId,pub:n.pub,t:Date.now()},true));};
n.clients.forEach(o=>o.onUp2=()=>{info();updListing();});info();n.timers.push(setInterval(info,60000));n.timers.push(setInterval(updListing,30000));
isHost=true;mode='p2p';ls.set('lg-room',n.code);keepAwake(true);
const d={v:1,rev:1,by:myId,status:'lobby',code:n.code,hostId:myId,pub:n.isPublic,quick:n.quick,players:[{id:myId,name:name,piece:myPiece(),score:0,cos:myCos()}]};S=null;apply(d);updListing();
}catch(e){toast('Couldn’t create the table: '+((e&&e.message)||e),6000);if(n&&net===n)cleanupP2P();done();failed();}}
async function onHostMsg(o,topic,m){const n=net;if(!n||n.role!=='host')return;if(topic.indexOf(NS+'lobby/')===0){onLobbyMsg(o,topic,m);return;}if(!m)return;
if(topic.slice(-2)==='/i'){const c=topic.slice(NS.length,-2);if(m.host&&m.host!==myId)n.seen[c]=m;return;}
if(!n.code||topic!==NS+n.code+'/h'||typeof m.f!=='string'||!m.i||!m.c)return;
let pl=n.players.get(m.f);
try{if(!pl||!pl.key||(m.p&&m.p!==pl.pub)){if(!m.p)return;const key=await sharedKey(n.kp.privateKey,m.p);pl=n.players.get(m.f)||{pid:null};pl.key=key;pl.pub=m.p;n.players.set(m.f,pl);}
const d=await unseal(pl.key,m);if(net!==n)return;pl.bi=o.bi;onHostData(pl,m.f,d);}catch(e){}}
function onHostData(pl,topic,d){if(!S||!d||typeof d!=='object')return;const n=net;
if(d.k==='hello'){const id=String(d.id||'').slice(0,24),name=cleanName(d.name);if(!id||id===myId)return;
if(n.banned.has(id)){sendPlayer(topic,pl,{k:'err',m:'The host removed you from this table.'});return;}
if(S.players.some(q=>q.id===id)){n.players.forEach((q,tp)=>{if(tp!==topic&&q.pid===id)n.players.delete(tp);});pl.pid=id;sendState(topic,pl);return;}
if(S.status!=='lobby'){sendPlayer(topic,pl,{k:'err',m:'That game has already started.'});return;}
if(S.players.length>=6){sendPlayer(topic,pl,{k:'err',m:'That table is full.'});return;}
n.players.forEach((q,tp)=>{if(tp!==topic&&q.pid===id)n.players.delete(tp);});pl.pid=id;
const want=PIECES[d.pc]&&!S.players.some(q=>q.piece===d.pc)?d.pc:(PK.find(x=>!S.players.some(q=>q.piece===x))||PK[0]);
const N=clone(S);N.players.push({id:id,name:name,piece:want,score:0,cos:validCos(d.cos)});N.rev++;N.by=myId;commit(N);return;}
if(!pl.pid)return;const idx=S.players.findIndex(q=>q.id===pl.pid);
if(d.k==='ping'){if((d.rev||0)!==(S.rev||0))sendState(topic,pl);else sendPlayer(topic,pl,{k:'pong'});return;}
if(d.k==='emote'){if(idx>=0)relayEmote(pl.pid,String(d.e||''));return;}
if(d.k==='chat'){if(idx>=0&&S.status!=='lobby')relayChat(pl.pid,String(d.m||''));return;}
if(d.k==='piece'){if(S.status!=='lobby'||idx<0||!PIECES[d.p]||S.players.some(q=>q.id!==pl.pid&&q.piece===d.p))return;const N=clone(S);N.players[idx].piece=d.p;N.rev++;N.by=myId;commit(N);return;}
if(d.k==='leave'){n.players.delete(topic);if(S.status==='lobby'&&idx>=0){const N=clone(S);N.players.splice(idx,1);N.rev++;N.by=myId;commit(N);}return;}
if(d.k==='act'&&idx>=0&&['drawStock','drawDiscard','discard','gin','next','again'].indexOf(d.type)>=0)act(d.type,typeof d.arg==='string'?d.arg:null,idx);}

/* joiner */
async function joinSend(obj){const n=net;if(!n||n.role!=='join'||!n.key)return false;
let o=n.clients[n.bi];if(!o||!o.ok)o=n.clients.find(x=>x.ok&&n.hasInfo[x.bi])||n.clients.find(x=>x.ok);if(!o)return false;
try{const m=await seal(n.key,obj);m.f=n.topic;m.p=n.pub;return pub(o,NS+n.code+'/h',m);}catch(e){return false;}}
async function netJoin(btn,name,code,opts){opts=opts||{};const done=netPrecheck(btn,'Connecting…');if(!done){if(opts.onFail)opts.onFail();return;}let n=null;
try{cleanupP2P();const keys=await newKeys();
n={role:'join',code:code,name:name,kp:keys.kp,pub:keys.pub,topic:rid(8),key:null,hostPub:null,bi:-1,hasInfo:{},last:0,ready:false,timers:[],clients:[],btn:btn};net=n;
n.fail=m=>{if(net!==n||n.ready)return;cleanupP2P();done();if(opts.onFail)opts.onFail(m);else toast(m,5000);};
n.onReady=()=>{isHost=false;mode='p2p';ls.set('lg-room',code);joinInfo={code:code,name:name};keepAwake(true);S=null;};
n.clients=takeClients(()=>[NS+code+'/i',NS+code+'/p/'+n.topic],onJoinMsg);
n.failT=setTimeout(()=>n.fail(!n.clients.some(o=>o.ok)?netErrMsg:n.hostPub?'The host isn’t answering. Ask them to open the game with the screen on.':'No table found with code '+code+'. Check the code and that the host has the game open.'),opts.timeout||20000);
anyUp(n.clients,10000).then(v=>{if(net!==n||n.ready)return;if(!v){setSrv('fail');n.fail(netErrMsg);}else{setSrv('ok');if(!n.hostPub)btn.textContent='Finding table…';}});
n.timers.push(setInterval(()=>{if(net!==n||document.hidden)return;
if(!n.ready){if(n.key)joinSend({k:'hello',id:myId,name:n.name,pc:myPiece(),cos:myCos()});return;}
joinSend({k:'ping',rev:S?S.rev||0:0});const gap=Date.now()-n.last;
if(gap>90000){toast('Lost the host. The table may have closed.',5000);endP2P();}
else if(gap>12000&&!n.warned){n.warned=true;toast('Waiting for the host to reconnect…');}},3500));
}catch(e){toast('Couldn’t join: '+((e&&e.message)||e),6000);if(n&&net===n)cleanupP2P();done();if(opts.onFail)opts.onFail();}}
async function onJoinMsg(o,topic,m){const n=net;if(!n||n.role!=='join'||!m)return;
if(topic===NS+n.code+'/i'){if(!m.pub||!m.host)return;n.hasInfo[o.bi]=true;
if(n.hostPub!==m.pub){n.hostPub=m.pub;n.bi=o.bi;if(!n.ready&&n.btn)n.btn.textContent='Joining table…';try{n.key=await sharedKey(n.kp.privateKey,m.pub);}catch(e){return;}joinSend({k:'hello',id:myId,name:n.name,pc:myPiece(),cos:myCos()});}
else if(n.bi<0||!n.clients[n.bi].ok)n.bi=o.bi;return;}
if(topic!==NS+n.code+'/p/'+n.topic||!n.key)return;
let d;try{d=await unseal(n.key,m);}catch(e){return;}if(net!==n)return;
n.bi=o.bi;n.last=Date.now();if(n.warned){n.warned=false;toast('Back at the table.');}
if(d.k==='err'){if(!n.ready){n.fail(String(d.m||'Couldn’t join that table.'));return;}toast(String(d.m||''),4000);endP2P();return;}
if(!n.ready){n.ready=true;clearTimeout(n.failT);n.onReady();}
if(d.k==='emote'){showEmote(String(d.p||''),String(d.e||''));return;}
if(d.k==='chat'){receiveChat(String(d.p||''),String(d.m||''));return;}
if(d.k==='bye'){toast('The host closed the table.',4000);endP2P();return;}
if(d.k==='state'&&d.s){if(S&&S.code===d.s.code&&(d.s.rev||0)<=(S.rev||0))return;apply(d.s);}}
function netWake(){const n=net;if(mode!=='p2p'||!n)return;keepAwake(true);
(n.clients||[]).forEach(o=>{try{if(!o.c.connected)o.c.reconnect();}catch(e){}});
if(n.role==='join'){n.last=Date.now();joinSend({k:'ping',rev:S?S.rev||0:0});}else broadcast();}

/* quick match */
let quickRun=0;
async function quickMatch(){if(db){toast('Quick Match works in the published game.');return;}if(!needName(()=>quickMatch()))return;
const run=++quickRun;cleanupP2P();renderQuickWait('Connecting…');warmUp();
const up=pool?await anyUp(pool,10000):false;if(run!==quickRun)return;
if(!up){setSrv('fail');toast(netErrMsg,5000);renderHome();return;}
setSrv('ok');setQuickText('Looking for an open table…');
await sleep(Object.keys(lobbyList).length?300:1600);if(run!==quickRun)return;
tryQuick(run,new Set());}
function tryQuick(run,tried){if(run!==quickRun)return;if(screen!=='quick')renderQuickWait('Looking for an open table…');
const l=openTables().filter(x=>!tried.has(x.code)).sort((a,b)=>(b.q-a.q)||(b.n-a.n)||(a.c-b.c));const btn=$('#qbtn');if(!btn)return;
if(l.length){const x=l[0];tried.add(x.code);setQuickText('Joining '+x.name+'’s table…');
netJoin(btn,myName(),x.code,{timeout:10000,onFail:()=>{if(run!==quickRun)return;warmUp();tryQuick(run,tried);}});}
else{setQuickText('No open tables. Creating one…');netCreate(btn,myName(),{pub:true,quick:true,onFail:()=>{if(run===quickRun)renderHome();}});}}

/* ---------- online (Claude-hosted db) ---------- */
function listen(){if(unsub)try{unsub();}catch(e){}
unsub=ref.onSnapshot(snap=>{if(!snap||!snap.exists)return;const d=clone(snap.data());
if(S&&S.code===d.code){if((d.rev||0)<(S.rev||0))return;if(d.rev===S.rev&&d.by===S.by)return;}
apply(d);},()=>toast('Lost connection to the table. Leave and join again.'));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function nameVal(then){const n=myName();if(!n){openProfile(then,'Choose a name so other players know who you are.');return null;}return n;}
async function create(btn){const name=nameVal(()=>{renderFriends();const b=document.querySelector('[data-a="create"]');if(b)create(b);});if(!name)return;if(!db){netCreate(btn,name,{pub:friendPub});return;}btn.disabled=true;mode='online';
try{let code,r;for(let i=0;i<5;i++){code=genCode();r=db.doc('tables/'+code);const s=await r.get();if(!s.exists||s.data().status==='over')break;}
const d={v:1,rev:1,by:myId,status:'lobby',code:code,hostId:myId,players:[{id:myId,name:name,piece:'manta',score:0}]};
await r.set(d);ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function join(btn,codeArg){const name=nameVal(()=>{renderFriends();const i=$('#code');if(i&&codeArg)i.value=codeArg;const b=document.querySelector('[data-a="join"]');if(b)join(b,codeArg);});if(!name)return;const code=String(codeArg||(($('#code')||{}).value||'')).trim().toUpperCase();
if(!/^[A-Z]{4}$/.test(code)){toast('Table codes are 4 letters.');return;}
if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
if(!db){netJoin(btn,name,code);return;}mode='online';btn.disabled=true;
try{const r=db.doc('tables/'+code);let s=await r.get();
if(!s.exists){toast('No table found with code '+code+'.');btn.disabled=false;return;}
let d=clone(s.data());
if(!d.players.some(q=>q.id===myId)&&d.status==='lobby'){
for(let i=0;i<6;i++){const l=await r.acquire({holder:myId,ttlMs:4000});if(l.acquired)break;await sleep(400+Math.random()*400);}
s=await r.get();d=clone(s.data());
if(d.status==='lobby'&&!d.players.some(q=>q.id===myId)){
if(d.players.length>=6){toast('That table is full.');btn.disabled=false;return;}
d.players.push({id:myId,name:name,piece:PK.find(id=>!d.players.some(q=>q.piece===id))||PK[0],score:0});d.rev=(d.rev||0)+1;d.by=myId;await r.set(d);}
}else if(!d.players.some(q=>q.id===myId))toast('That game already started. You can watch.');
ref=r;ls.set('lg-room',code);S=null;listen();apply(d);
}catch(e){toast(errMsg(e));btn.disabled=false;}}
async function setPiece(pid){closeSheet();if(mode==='p2p'&&S&&S.status==='lobby'){if(isHost){if(S.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone already has that one.');return;}const N=clone(S);N.players[meIdx()].piece=pid;N.rev++;N.by=myId;commit(N);}else joinSend({k:'piece',p:pid});return;}
if(!ref||!S||S.status!=='lobby')return;
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;
if(d.players.some(q=>q.id!==myId&&q.piece===pid)){toast('Someone just took that one.');return;}
const me=d.players.find(q=>q.id===myId);if(!me)return;me.piece=pid;d.rev=(d.rev||0)+1;d.by=myId;apply(d);await ref.set(d);
}catch(e){toast(errMsg(e));}}
async function startGame(){if(!S||S.hostId!==myId||S.players.length<2)return;
if(mode==='p2p'){const d=clone(S);d.players.forEach(p=>p.score=0);deal(d);d.rev=(S.rev||0)+1;d.by=myId;commit(d);return;}
try{const s=await ref.get();const d=clone(s.data());if(d.status!=='lobby')return;d.players.forEach(p=>p.score=0);deal(d);d.rev=(d.rev||0)+1;d.by=myId;commit(d);}catch(e){toast(errMsg(e));}}
async function leave(){closeSheet();closeOv();clearTimeout(botT);botT=null;if(mode==='solo'){clearTimeout(soloSaveT);if(S&&S.status==='over')ls.del('lg-solo');else if(S)ls.set('lg-solo',JSON.stringify(S));mode=null;S=null;renderHome();return;}
if(mode==='p2p'){const n=net;quickRun++;if(n&&n.role==='host')n.players.forEach((pl,tp)=>sendPlayer(tp,pl,{k:'bye'}));else if(n&&S&&S.status==='lobby')joinSend({k:'leave'});
mode=null;S=null;isHost=false;joinInfo=null;keepAwake(false);netClose();renderHome();return;}
if(S&&S.status==='lobby'&&ref&&S.hostId!==myId){try{const s=await ref.get();const d=clone(s.data());if(d.status==='lobby'){d.players=d.players.filter(q=>q.id!==myId);d.rev++;d.by=myId;await ref.set(d);}}catch(e){}}
if(unsub)try{unsub();}catch(e){}unsub=null;ref=null;S=null;renderHome();}

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id==='code')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeChat();closeEmotes();}if(e.key==='Enter'&&e.target.id==='chatin'){e.preventDefault();sendChat(e.target.value);return;}if(e.key==='Enter'&&e.target.id==='code'){const b=document.querySelector('[data-a="join"]');b&&!b.disabled&&join(b);}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
if(ls.get('dd-music')!=='0')Music.set(true);
const unlockAudio=()=>{AU.unlock();};
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
/* stop all sound when the tab is hidden or the phone locks; bring it back on return */
function onHide(){Music.pause();AU.sleep();}
function onShow(){if(document.hidden)return;if(Music.on||ls.get('dd-sfx')!=='0')AU.wake();Music.resume();netWake();if((screen==='home'||screen==='friends')&&!net)warmUp();if(screen==='table')layoutHand();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)onHide();else onShow();});
window.addEventListener('pagehide',onHide);
window.addEventListener('pageshow',()=>{if(!document.hidden)onShow();});
window.addEventListener('online',()=>{if(mode==='p2p')netWake();});
document.addEventListener('click',e=>{const tr=$('#emotray');if(tr&&!tr.hidden&&!e.target.closest('#emotray,#emobtn'))tr.hidden=true;
const cbar=$('#chatbar');if(cbar&&!cbar.hidden&&!e.target.closest('#chatbar,#chatbtn'))closeChat();
const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
switch(a){
case 'profile':case 'goProfile':renderProfile();break;
case 'editProfile':openProfile(()=>renderProfile());break;
case 'goStore':renderStore();break;
case 'stab':renderStore(b.dataset.c);break;
case 'item':openItem(b.dataset.id);break;
case 'buy':buyItem(b.dataset.id);break;
case 'equip':equipItem(b.dataset.id);break;
case 'fxPreview':playEffect(b.dataset.id,$('#bigprev'));break;
case 'smoothToggle':ls.set('dd-smooth',isSmooth()?'0':'1');applyCosmetics();if(screen==='profile')renderProfile();else if(S&&screen==='table'){const f=document.querySelector('.scenefx');if(f&&isSmooth())f.remove();openMenu();}break;
case 'profPiece':profPick=b.dataset.p;document.querySelectorAll('[data-a="profPiece"]').forEach(x=>x.classList.toggle('sel',x===b));break;
case 'saveProfile':saveProfile();break;
case 'quick':quickMatch();break;
case 'quickCancel':quickRun++;cleanupP2P();keepAwake(false);S=null;mode=null;renderHome();break;
case 'goFriends':renderFriends();break;
case 'goComputer':renderComputer();break;
case 'goHome':renderHome();break;
case 'howto':openHowTo();break;
case 'setPub':{friendPub=b.dataset.v==='1';document.querySelectorAll('[data-a="setPub"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const h=$('#seghint');if(h)h.textContent=friendPub?'Anyone can see and join from Open tables.':'Only people with your invite link or code can join.';break;}
case 'joinOpen':join(b,b.dataset.code);break;
case 'share':shareInvite();break;
case 'copyCode':if(S&&S.code)copyText(S.code,'Code copied');break;
case 'lobbyPub':setLobbyPub(b.dataset.v==='1');break;
case 'kick':kickPlayer(b.dataset.id);break;
case 'emotes':toggleEmotes();break;
case 'chat':{const cb=$('#chatbar');if(cb&&!cb.hidden)closeChat();else openChat();break;}
case 'chatSend':sendChat(($('#chatin')||{}).value);break;
case 'chatQuick':sendChat(b.dataset.m);break;
case 'chatToggle':ls.set('dd-chat',chatOff()?'1':'0');if(chatOff())closeChat();if(S){renderTable();openMenu();}break;
case 'emote':sendEmote(b.dataset.e);break;
case 'opp':openPlayer(+b.dataset.k);break;
case 'mutep':{const id=b.dataset.id;if(mutedP.has(id))mutedP.delete(id);else mutedP.add(id);const k=S?S.players.findIndex(q=>q.id===id):-1;if(k>=0)openPlayer(k);break;}
case 'emute':ls.set('dd-emute',emotesMuted()?'0':'1');if(S)openMenu();break;
case 'music':{AU.unlock();const v=Music.set(!Music.on);ls.set('dd-music',v?'1':'0');if($('#sheet').classList.contains('open')&&S)openMenu();break;}
case 'sfx':{const v=ls.get('dd-sfx')==='0';ls.set('dd-sfx',v?'1':'0');if(v){AU.unlock();SFX.tick();}if(S)openMenu();break;}
case 'create':create(b);break;
case 'bots':soloBots=+b.dataset.n;document.querySelectorAll('[data-a="bots"]').forEach(x=>{const on=+x.dataset.n===soloBots;x.classList.toggle('primary',on);x.classList.toggle('soft',!on);x.setAttribute('aria-pressed',on);});break;
case 'solo':startSolo();break;
case 'resumeSolo':try{const d=JSON.parse(ls.get('lg-solo'));mode='solo';ref=null;S=null;apply(d);scheduleBot();}catch(err){ls.del('lg-solo');renderHome();}break;
case 'join':join(b);break;
case 'pick':openPicker();break;
case 'setPiece':setPiece(b.dataset.p);break;
case 'start':b.disabled=true;startGame();break;
case 'leave':leave();break;
case 'menu':openMenu();break;
case 'close':closeSheet();break;
case 'arrange':order=arranged(myHand());selected=null;layoutHand();renderActs();buzz(6);break;
case 'gin':buzz([15,40,25]);act('gin');break;
case 'discardSel':if(selected)act('discard',selected);break;
case 'skip':closeSheet();act('skip');break;
case 'next':case 'again':closeOv();act(a);break;
case 'drawDiscard':if(canDiscard()&&selected&&myHand().includes(selected)){act('discard',selected);break;}act(a);break;
case 'drawStock':act(a);break;
}});
applyCosmetics();renderHome();
setTimeout(runPending,300);
/* warm up online play in the background so Create/Join feel instant */
const idle=window.requestIdleCallback||(fn=>setTimeout(fn,1200));
idle(()=>warmUp(),{timeout:2500});
(async()=>{try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}if(db&&screen==='home'){const a=document.activeElement&&document.activeElement.id;if(!a)renderHome();}})();
})();
</script>
